<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Community Tool Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="panel auth-box">
    <h1>Community Tool Library</h1>
    <p class="subtitle">Log in to manage items and loans.</p>
    <form action="#" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="auth-link">No account yet? <a href="register.html">Register here</a>.</p>
    <p class="auth-link"><a href="index.html">Skip to the dashboard</a></p>
  </main>
</body>
</html>
